# Usage: Playwright tests against one environment, right after its deploy job deploy-<environment>.
# The job takes stage test.<environment> and the deploy job's rules, and imports its dotenv report:
# ENVIRONMENT_URL_PRIMARY and ENVIRONMENT_URL_ALIASES (comma-separated). playwright.config.js picks
# the URL named by PLAYWRIGHT_URL (primary, alias_0, alias_1, ...) and the suite PLAYWRIGHT_SUITE.
#
# include:
#   - remote: 'https://raw.githubusercontent.com/xima-media/gitlab-templates/<release>/test-playwright.yml'
#     inputs:
#       environment: test
#       tests:
#         - PLAYWRIGHT_SUITE: ["e2e", "accessibility"]
#         - PLAYWRIGHT_SUITE: calendar
#           PLAYWRIGHT_URL: alias_0

spec:
  inputs:
    environment:
      type: string
      options: ["dev", "test", "live"]
      description: "Environment the tests run against, after its deploy job deploy-<environment>."
    tests:
      type: array
      default: [{PLAYWRIGHT_URL: "primary"}]
      description: "Jobs in parallel:matrix format: PLAYWRIGHT_SUITE (subdirectory of Tests/Playwright, all if unset) and PLAYWRIGHT_URL (primary, alias_<n>)."
    enabled:
      type: boolean
      default: true
      description: "Whether to run the tests."

---

test-playwright-$[[ inputs.environment ]]:
  stage: test.$[[ inputs.environment ]]
  # Prebuilt image from https://github.com/xima-media/typo3-docker
  image:
    name: ghcr.io/xima-media/playwright:1.59.1@sha256:57dfa6a0ed6045a5ee00de143413055973c7f569e30b03d59a912c73473dfb60
  dependencies:
    - deploy-$[[ inputs.environment ]]
  rules:
    - if: '"$[[ inputs.enabled ]]" != "true"'
      when: never
    - !reference ['deploy-$[[ inputs.environment ]]', rules]
  parallel:
    matrix: $[[ inputs.tests ]]
  script:
    - playwright test
  artifacts:
    when: always
    paths:
      - Tests/Playwright/playwright-report/
      - Tests/Playwright/test-results/
    reports:
      junit: Tests/Playwright/test-results/junit.xml
    expire_in: 7 days
