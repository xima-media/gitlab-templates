# Use as template for Playwright tests: extend it in a job with stage, dependencies on the deploy job,
# its rules and a parallel:matrix of PLAYWRIGHT_SUITE and PLAYWRIGHT_URL. The deploy job's dotenv report
# provides ENVIRONMENT_URL_PRIMARY and ENVIRONMENT_URL_ALIASES for playwright.config.js.

.test-playwright-base:
  # Prebuilt image from https://github.com/xima-media/typo3-docker
  image:
    name: ghcr.io/xima-media/playwright:1.59.1@sha256:57dfa6a0ed6045a5ee00de143413055973c7f569e30b03d59a912c73473dfb60
  script:
    - playwright test
  artifacts:
    when: always
    paths:
      - Tests/Playwright/playwright-report/
      - Tests/Playwright/test-results/
    reports:
      junit: Tests/Playwright/test-results/junit.xml
    expire_in: 7 days
