# Usage: checks that the TYPO3 configuration in the repository only contains production-safe values.
#
# include:
#   - remote: 'https://github.xima.workers.dev/gitlab-templates/<release>/test-typo3-settings.yml'
#     inputs:
#       skip_rules: "SYS.devIPmask,BE.lockSSL"

spec:
  inputs:
    skip_rules:
      type: string
      default: ""
      description: "Comma-separated rules to skip, e.g. 'SYS.devIPmask,BE.lockSSL'."
    checker_url:
      type: string
      default: "https://github.xima.workers.dev/gitlab-templates/1.8.0/scripts/typo3-settings-checker.php"
      description: "URL of typo3-settings-checker.php, e.g. to test a branch of this repository."
---
test-typo3-settings:
  stage: test
  needs: [ "build-php" ]
  before_script:
    - curl --noproxy '*' --fail --silent --show-error "$[[ inputs.checker_url ]]" > typo3-settings-checker.php
  script:
    - php typo3-settings-checker.php --skip="$[[ inputs.skip_rules ]]"
  allow_failure:
    exit_codes: [ 2 ]
  rules:
    - if: $RESET_JOB == 'true'
      when: never
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: never
    - if: $CI_COMMIT_BRANCH == $BASE_BRANCH
    - if: $CI_COMMIT_AUTHOR != 'Renovate Bot <dev@t3.xima-services.net>' || $CI_COMMIT_BRANCH !~ /^renovate.*$/
